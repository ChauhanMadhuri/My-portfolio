

<!DOCTYPE html>
<html>
<head>
    
    <title>HTML5 Multimedia Player</title>
</head>
<body style="border: 5px solid black; padding:20px;">
    
    <h1>Welcome to the HTML5 Multimedia Player</h1>

    <ul>
        <li><a href="#audio">Audio Player</a></li>
        <li><a href="#video">Video Player</a></li>
        <li><a href="#gallery">Image Gallery</a></li>
    </ul>

    <h2 id="audio">Audio Player</h2>
    <audio controls loop>
        <source src="Jai Shri Ram (Hindi).mp3" type="audio/mpeg">
    </audio>

    <h2 id="video">Video Player</h2>
    <video controls width="800px" height="500px">
        <source src="" type="video/mp4">
    </video>

    <h2 id="gallery">Image Gallery</h2>

    <img src="image1.jpg" width="400" height="200">
    <img src="image2.jpg" width="400" height="200">
    <img src="image3.jpg" width="400" height="200">

    <h2>Multimedia Content Table</h2>

    <table border="3" cellpadding="8">
        <tr>
            <th>Type</th>
            <th>File</th>
            <th>Format</th>
        </tr>
        <tr>
            <td>Audio</td>
            <td>audio.mp3</td>
            <td>MP3</td>
        </tr>
        <tr>
            <td>Video</td>
            <td>video.mp4</td>
            <td>MP4</td>
        </tr>
        <tr>
            <td>Images</td>
            <td>image1.jpg, image2.jpg, image3.jpg</td>
            <td>JPG</td>
        </tr>
    </table>

    <br>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d117977.65955533393!2d69.
        97189897794465!3d22.47407891943769!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.
        1!3m3!1m2!1s0x3957154934c04597%3A0xe8b7dd81a49b75ca!2sJamnagar%2C%20Gujarat!
        5e0!3m2!1sen!2sin!4v1782117908488!5m2!1sen!2sin" 
        width="100%" height="550" style="border:0;" allowfullscreen=""
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <footer>
        <p> &copy; 2025 HTML5 Multimedia Player</p>
    </footer>

</body>
</html>
