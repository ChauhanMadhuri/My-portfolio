<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.css"
        integrity="sha512-qjes4kMRtfb2sdliSYNsNcJV92e+oZjG0ef8+GNJqFuqz5VtEt7KDIgNnmHca5BwCmLUZsIld50fTuofNCaDxQ=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <title>C Programming Projects</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #222222;
    }

    /* ================= HEADER ================= */

    .hero {
        background: #ffffff;
        color: #222222;
        padding: 55px 20px 45px;
        text-align: center;
        border-bottom: 1px solid #eeeeee;
    }

    .hero-icon {
        font-size: 52px;
        margin-bottom: 12px;
        color: #d2691e;
    }

    .hero h1 {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #222222;
    }

    .hero h1::first-letter {
        color: #222222;
    }

    .hero p {
        font-size: 18px;
        color: #777777;
    }

    /* ================= PROJECT SECTION ================= */

    .projects-section {
        padding: 55px 0 70px;
        background: #ffffff;
    }

    .section-title {
        text-align: center;
        margin-bottom: 38px;
    }

    .section-title h2 {
        font-size: 32px;
        font-weight: 700;
        color: #222222;
    }

    .section-title p {
        color: #777777;
        margin-top: 8px;
    }

    /* ================= CARD ================= */

    .project-card {
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 10px;
        padding: 28px 22px 22px;
        height: 100%;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        text-align: center;
    }

    .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
        border-color: #d2691e;
    }

    /* ================= ICON ================= */

    .project-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff3e8;
        color: #d2691e;
        border-radius: 8px;
        font-size: 28px;
        transition: 0.3s;
    }

    .project-card:hover .project-icon {
        background: #d2691e;
        color: #ffffff;
    }

    /* ================= CARD TEXT ================= */

    .project-card h2 {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #222222;
    }

    .project-card h3 {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 15px;
        color: #222222;
    }

    .project-card p {
        color: #777777;
        line-height: 1.6;
        min-height: 75px;
    }

    /* ================= BUTTON ================= */

    .project-btn {
        display: inline-block;
        margin-top: 10px;
        background: #d2691e;
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 7px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
    }

    .project-btn:hover {
        background: #222222;
        color: #ffffff;
    }

    /* ================= FOOTER ================= */

    footer {
        background: #222222;
        color: #ffffff;
        text-align: center;
        padding: 22px 15px;
        margin-top: 10px;
    }

    footer p {
        margin: 0;
        color: #eeeeee;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 992px) {
        .project-card h2 {
            font-size: 20px;
        }
    }

    @media (max-width: 768px) {
        .hero {
            padding: 45px 20px 35px;
        }

        .hero h1 {
            font-size: 32px;
        }

        .hero p {
            font-size: 16px;
        }

        .projects-section {
            padding: 45px 0 55px;
        }
    }
</style>

</head>


<body>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <div class="hero-icon">
                <i class="bi bi-code-slash"></i>
            </div>

            <h1>
                My <span style="color:#d2691e;">C++ Programming</span> Projects
            </h1>

            <p>
                My C++ Programming Practice Programs
            </p>

        </div>

    </section>



    <!-- ================= PROJECTS ================= -->

    <section class="projects-section">

        <div class="container">

            <div class="section-title">

                <h2>
                    My Projects
                </h2>

                <p>
                    Select a category to view all programs
                </p>

            </div>


            <div class="row g-4">
                <!--card 1-->
                <div class="col-xl-3 col-lg-4 col-md-6">
                    <div class="project-card">
                        <div class="project-icon">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                        <h2>
                           Time Convertor
                        </h2>
                        <h3>
                            Project-1
                        </h3>
                        <a href="1_project/time.html"
                            class="project-btn">
                            Open Programs
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>

                <!--card 2-->

                <div class="col-xl-3 col-lg-4 col-md-6">
                    <div class="project-card">
                        <div class="project-icon">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                        <h2>
                           Railway System
                        </h2>
                        <h3>
                            Project-2
                        </h3>
                        <a href="2_poject/rail.html"
                            class="project-btn">
                            Open Programs
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
                

            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
