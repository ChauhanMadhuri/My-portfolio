<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="frame2.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="main">

    <div class="card">

        <div class="top">

            <div class="text">
                <h2>Krish R</h2>
                <p>Instructor</p>
            </div>

            <div class="image">
                <img src="man.avif" alt="Profile">
            </div>

        </div>

        <div class="social">

            <i class="fa-brands fa-facebook-f"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-linkedin-in"></i>
            <i class="fa-brands fa-instagram"></i>

        </div>

        <div class="bottom">

            <p>
                Subscribe Easy Tutorials<br>
                YouTube channel to watch more<br>
                videos on Web design
            </p>

        </div>

    </div>

</div>

</body>
</html>
