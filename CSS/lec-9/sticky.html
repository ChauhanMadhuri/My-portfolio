<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stikey_notes</title>
    <link rel="stylesheet" href="stikey.css">
</head>
<body>
   <div class="header">
    <h1> Sticky Notes dashboard</h1>
   </div> 
<div class="container">
   <div class="di1"> 
    <h3 > Categories </h3>
     <div>
        <select class="so"> 
        <option> HTML </option>
        <option> C </option>
        <option> CF </option>
        <option>CSS</option>
      </select>
    </div>
    <div>
    <select class="so"> 
        <option> DSA </option>
        <option> JAVA </option>
        <option> PHP </option>
        <option>CSS</option>
    </select>
    </div>

    <div>
    <select class="so"> 
        <option> jamnagar </option>
        <option>Surat </option>
        <option>Morabi</option>
    </select>
    </div>

   </div>
   <!--card-->
<div class="di2">
    <div class="card">
        <div class="sticky yellow">
            <h3>📝 Meeting Notes</h3>
            <p>Project deadline is next Monday.</p>
        </div>

        <div class="sticky green">
            <h3>📌 Grocery List</h3>
            <p>Milk, Eggs, Bread, Coffee.</p>
        </div>

        <div class="sticky orange">
            <h3>💡 App Idea</h3>
            <p>Reminder app with voice input.</p>
        </div>

        <div class="sticky blue">
            <h3>🎯 Today's Goals</h3>
            <p>Finish UI<br>Record Demo</p>
        </div>
    </div>
    <div class="btn">
        <button class="bt1"> Add Note</button>
        <button class="bt1"> Delete All</button>
    </div>
 </div>
</div>  
</body>
</html>
